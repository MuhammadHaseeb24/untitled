name: kingdoms_of_ember
description: Ember Legion - an original stickman army strategy game built with Flutter and Flame.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_audio: ^2.12.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flame_lint: ^1.2.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E1020"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
